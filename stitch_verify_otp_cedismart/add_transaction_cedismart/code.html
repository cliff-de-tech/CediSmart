<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-bright": "#fdf8fd",
              "surface": "#fdf8fd",
              "on-tertiary-container": "#ffeee8",
              "on-tertiary": "#ffffff",
              "surface-dim": "#ddd9de",
              "on-tertiary-fixed-variant": "#802a00",
              "on-error-container": "#93000a",
              "secondary-fixed": "#e0e0ff",
              "on-primary": "#ffffff",
              "outline-variant": "#bfcaba",
              "tertiary-fixed": "#ffdbcf",
              "primary-container": "#2e7d32",
              "outline": "#707a6c",
              "on-secondary-fixed": "#000767",
              "on-secondary-fixed-variant": "#343d96",
              "inverse-on-surface": "#f4eff5",
              "primary-fixed": "#a3f69c",
              "on-error": "#ffffff",
              "on-primary-fixed-variant": "#005312",
              "inverse-surface": "#313034",
              "on-tertiary-fixed": "#380d00",
              "on-surface-variant": "#40493d",
              "surface-variant": "#e5e1e7",
              "on-background": "#1c1b1f",
              "on-secondary-container": "#27308a",
              "error-container": "#ffdad6",
              "surface-container-low": "#f7f2f8",
              "on-primary-container": "#cbffc2",
              "secondary-container": "#959efd",
              "on-surface": "#1c1b1f",
              "tertiary-container": "#c24300",
              "surface-container": "#f1ecf2",
              "background": "#fdf8fd",
              "secondary-fixed-dim": "#bdc2ff",
              "surface-container-highest": "#e5e1e7",
              "primary-fixed-dim": "#88d982",
              "tertiary": "#993300",
              "surface-tint": "#1b6d24",
              "primary": "#0d631b",
              "on-secondary": "#ffffff",
              "inverse-primary": "#88d982",
              "error": "#ba1a1a",
              "tertiary-fixed-dim": "#ffb59a",
              "surface-container-lowest": "#ffffff",
              "on-primary-fixed": "#002204",
              "surface-container-high": "#ebe7ec",
              "secondary": "#4c56af"
            },
            fontFamily: {
              "headline": ["Manrope", "sans-serif"],
              "body": ["Inter", "sans-serif"],
              "label": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .editorial-shadow {
            box-shadow: 0 32px 64px -12px rgba(28, 27, 31, 0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen">
<!-- Top App Bar -->
<header class="bg-[#fdf8fd] dark:bg-gray-950 flex items-center justify-between px-5 py-4 w-full sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="hover:bg-[#f7f2f8] dark:hover:bg-gray-800 transition-colors p-2 rounded-full scale-95 active:opacity-80 duration-200">
<span class="material-symbols-outlined text-[#0d631b] dark:text-[#2e7d32]" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-manrope font-bold tracking-tight text-xl text-on-surface">Add Transaction</h1>
</div>
<div class="flex items-center gap-2">
<span class="font-inter uppercase tracking-widest text-xs text-outline">GHS WALLET</span>
</div>
</header>
<main class="max-w-2xl mx-auto px-5 pt-8 pb-32">
<!-- Editorial Header: Amount Input -->
<section class="mb-12 text-center">
<span class="font-label uppercase tracking-widest text-[10px] text-outline mb-2 block">Enter Amount</span>
<div class="inline-flex items-baseline gap-2">
<span class="font-headline font-bold text-2xl text-primary">GHS</span>
<input class="bg-transparent border-none text-center font-headline font-extrabold text-6xl md:text-7xl tracking-tighter text-on-surface focus:ring-0 w-full max-w-[300px]" placeholder="0.00" type="text" value="150.00"/>
</div>
<div class="h-1 w-12 bg-primary/20 mx-auto mt-4 rounded-full"></div>
</section>
<!-- Transaction Type Toggle -->
<section class="mb-10">
<div class="bg-surface-container-low p-1.5 rounded-full flex gap-1 editorial-shadow max-w-xs mx-auto">
<button class="flex-1 py-3 px-6 rounded-full font-headline font-bold text-sm transition-all duration-300 bg-primary text-white shadow-lg">
                    Expense
                </button>
<button class="flex-1 py-3 px-6 rounded-full font-headline font-bold text-sm transition-all duration-300 text-on-surface-variant hover:bg-surface-container-highest">
                    Income
                </button>
</div>
</section>
<!-- Form Bento Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<!-- Category Picker -->
<button class="bg-surface-container-lowest p-6 rounded-[1.5rem] flex flex-col items-start gap-4 transition-all hover:bg-surface-container-low text-left editorial-shadow group">
<div class="w-12 h-12 rounded-2xl bg-tertiary-container flex items-center justify-center text-white group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="restaurant" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div>
<span class="font-label uppercase tracking-widest text-[10px] text-outline block mb-1">Category</span>
<span class="font-headline font-bold text-lg text-on-surface">Food &amp; Chop</span>
</div>
</button>
<!-- Account Picker -->
<button class="bg-surface-container-lowest p-6 rounded-[1.5rem] flex flex-col items-start gap-4 transition-all hover:bg-surface-container-low text-left editorial-shadow group">
<div class="w-12 h-12 rounded-2xl bg-secondary-container flex items-center justify-center text-on-secondary-container group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="account_balance_wallet" style="font-variation-settings: 'FILL' 1;">account_balance_wallet</span>
</div>
<div>
<span class="font-label uppercase tracking-widest text-[10px] text-outline block mb-1">Account</span>
<span class="font-headline font-bold text-lg text-on-surface">MTN MoMo</span>
</div>
</button>
<!-- Date Selector -->
<button class="bg-surface-container-lowest p-6 rounded-[1.5rem] flex flex-col items-start gap-4 transition-all hover:bg-surface-container-low text-left editorial-shadow col-span-1 md:col-span-2 group">
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-4">
<div class="w-12 h-12 rounded-2xl bg-surface-container-high flex items-center justify-center text-on-surface-variant group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined" data-icon="calendar_today">calendar_today</span>
</div>
<div>
<span class="font-label uppercase tracking-widest text-[10px] text-outline block mb-1">Date</span>
<span class="font-headline font-bold text-lg text-on-surface">Today, 24 Oct</span>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</div>
</button>
<!-- Description Field -->
<div class="col-span-1 md:col-span-2 relative">
<div class="bg-surface-container-low rounded-[1.5rem] p-6 focus-within:bg-surface-container-highest transition-colors">
<label class="font-label uppercase tracking-widest text-[10px] text-outline block mb-2">Description (Optional)</label>
<textarea class="w-full bg-transparent border-none p-0 focus:ring-0 font-body text-on-surface placeholder:text-outline/50 resize-none" placeholder="What was this for?" rows="2"></textarea>
</div>
</div>
</div>
<!-- Attachment/Tag Options (Extra Polish) -->
<div class="mt-8 flex gap-3 overflow-x-auto pb-4 no-scrollbar">
<button class="whitespace-nowrap px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-label text-xs font-semibold uppercase tracking-wider hover:bg-surface-variant transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="sell">sell</span> Add Tag
            </button>
<button class="whitespace-nowrap px-6 py-3 rounded-full bg-surface-container-high text-on-surface-variant font-label text-xs font-semibold uppercase tracking-wider hover:bg-surface-variant transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="receipt">receipt</span> Attach Receipt
            </button>
</div>
</main>
<!-- Bottom Navigation Layer (Mandatory Shell Integration) -->
<div class="fixed bottom-0 left-0 w-full bg-[#fdf8fd]/80 dark:bg-gray-950/80 backdrop-blur-xl flex justify-around items-center px-6 pb-8 pt-4 z-50 rounded-t-3xl border-t border-black/5 shadow-[0_-4px_32px_rgba(0,0,0,0.04)]">
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 p-2 hover:text-[#0d631b] dark:hover:text-[#2e7d32]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-inter text-[10px] font-medium tracking-wide">Ledger</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 p-2 hover:text-[#0d631b] dark:hover:text-[#2e7d32]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="insights">insights</span>
<span class="font-inter text-[10px] font-medium tracking-wide">Insights</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#0d631b] text-white rounded-2xl p-2 min-w-[64px] scale-110 transition-transform duration-300 ease-out" href="#">
<span class="material-symbols-outlined mb-1" data-icon="add_circle">add_circle</span>
<span class="font-inter text-[10px] font-medium tracking-wide">Transact</span>
</a>
<a class="flex flex-col items-center justify-center text-gray-500 dark:text-gray-400 p-2 hover:text-[#0d631b] dark:hover:text-[#2e7d32]" href="#">
<span class="material-symbols-outlined mb-1" data-icon="security">security</span>
<span class="font-inter text-[10px] font-medium tracking-wide">Vault</span>
</a>
</div>
<!-- Floating Primary Action Button -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 w-full max-w-xs px-5 md:px-0">
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-white py-5 rounded-[1.25rem] font-headline font-bold text-lg shadow-2xl shadow-primary/30 hover:scale-105 active:scale-95 transition-all duration-300 flex items-center justify-center gap-3">
<span>Save Transaction</span>
<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>
</button>
</div>
</body></html>

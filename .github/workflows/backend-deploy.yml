name: Backend Health Check

# Render owns deployments. This workflow checks API availability after CI;
# it does not trigger a deployment or assert which commit is currently live.
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-health-check
  cancel-in-progress: true

jobs:
  health-check:
    name: Verify Render API health
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check Render health endpoint
        env:
          PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL || 'https://cedismart-api.onrender.com' }}
        run: |
          # Retry transient deploy restarts and Render cold starts for up to five minutes.
          curl --fail --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 10 --retry-max-time 300 \
            --connect-timeout 10 --max-time 30 \
            --output health.json "${PRODUCTION_API_URL%/}/health"

          python3 - <<'PY'
          import json
          from pathlib import Path

          response = json.loads(Path("health.json").read_text())
          if response.get("status") != "healthy":
              raise SystemExit("Render API health check did not report healthy.")
          print("Render API is healthy.")
          PY

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 65" width="300" height="65">
  <style>
    .text-cedi {
      fill: #111827;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
    }
    .text-smart {
      fill: #0A6E4A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
    }
    .brand-subtext {
      fill: #4B5563;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 600;
      font-size: 9px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    @media (prefers-color-scheme: dark) {
      .text-cedi {
        fill: #F9FAFB;
      }
      .brand-subtext {
        fill: #9CA3AF;
      }
    }
  </style>
  <text x="0" y="38">
    <tspan class="text-cedi">Cedi</tspan>
    <tspan class="text-smart">Smart</tspan>
  </text>
  <text x="2" y="54" class="brand-subtext">Sovereign Ledger</text>
</svg>

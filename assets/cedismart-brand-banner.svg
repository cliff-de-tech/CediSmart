<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02140D"/>
      <stop offset="60%" stop-color="#052618"/>
      <stop offset="100%" stop-color="#010D08"/>
    </linearGradient>
    
    <!-- Accent Green Glow -->
    <radialGradient id="glow-grad" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Button/Badge Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A6E4A"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    
    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="800" height="240" rx="16" fill="url(#bg-grad)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.15"/>
  
  <!-- Glowing effect circle -->
  <circle cx="680" cy="80" r="180" fill="url(#glow-grad)"/>
  
  <!-- Abstract Decorative Geometry -->
  <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1" fill="none">
    <circle cx="80" cy="180" r="100"/>
    <circle cx="80" cy="180" r="140"/>
    <path d="M 500,0 L 600,240 M 540,0 L 640,240 M 580,0 L 680,240"/>
  </g>

  <!-- Title "CediSmart" -->
  <text x="60" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="52" letter-spacing="-0.02em" filter="url(#shadow)">
    <tspan fill="#FFFFFF">Cedi</tspan>
    <tspan fill="#34D399">Smart</tspan>
  </text>

  <!-- Subtitle -->
  <text x="64" y="130" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="14" letter-spacing="0.1em" opacity="0.85">
    SOVEREIGN DIGITAL LEDGER SYSTEM
  </text>
  
  <!-- Mini Description -->
  <text x="64" y="152" fill="#9CA3AF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="400" font-size="11" letter-spacing="0.02em">
    Optimized for the Ghanaian market • Offline-first • Mobile Money &amp; Bank Integration
  </text>

  <!-- Badges at bottom -->
  <!-- Badge 1: Phone-First -->
  <g transform="translate(64, 185)">
    <rect width="130" height="24" rx="12" fill="#022C22" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="15" cy="12" r="4" fill="#34D399"/>
    <text x="28" y="16" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="0.05em">PHONE-FIRST AUTH</text>
  </g>

  <!-- Badge 2: MoMo & Bank -->
  <g transform="translate(206, 185)">
    <rect width="130" height="24" rx="12" fill="#022C22" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="15" cy="12" r="4" fill="#34D399"/>
    <text x="28" y="16" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="0.05em">MOMO &amp; BANK AWARE</text>
  </g>

  <!-- Badge 3: Sync Engine -->
  <g transform="translate(348, 185)">
    <rect width="140" height="24" rx="12" fill="#022C22" stroke="#10B981" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="15" cy="12" r="4" fill="#34D399"/>
    <text x="28" y="16" fill="#F3F4F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="9" letter-spacing="0.05em">OFFLINE SYNC ENGINE</text>
  </g>

  <!-- Brand logo graphic in top-right -->
  <g transform="translate(640, 50)" filter="url(#shadow)">
    <!-- Abstract Shield or Cedi coin shape -->
    <path d="M30,5 L55,18 L55,48 L30,62 L5,48 L5,18 Z" fill="url(#badge-grad)" opacity="0.95"/>
    <path d="M30,10 L50,22 L50,45 L30,56 L10,45 L10,22 Z" fill="#02140D"/>
    <!-- Cedi Sign Symbol "₵" inside the logo shield -->
    <text x="30" y="41" text-anchor="middle" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="24">₵</text>
  </g>
</svg>

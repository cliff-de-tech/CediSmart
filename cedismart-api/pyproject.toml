[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cedismart-api"
version = "0.1.0"
description = "CediSmart — Production-grade fintech budget management API for Ghana"
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy[asyncio]==2.0.48",
    "asyncpg==0.30.0",
    "alembic==1.14.1",
    "pydantic-settings==2.7.1",
    "pydantic[email]==2.10.5",
    "redis[asyncio]==5.2.1",
    "bcrypt==4.2.1",
    "python-jose[cryptography]==3.3.0",
    "slowapi==0.1.9",
    "httpx==0.28.1",
    "cryptography==44.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "httpx==0.28.1",
    "ruff==0.9.4",
    "black==24.10.0",
    "mypy==1.14.1",
    "bandit==1.8.3",
    "aiosqlite==0.20.0",
    "coverage==7.6.10",
    "pytest-cov==6.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [
    "alembic",
    ".venv",
    ".git",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
ignore = [
    "E501",     # Line too long (managed by black)
    "E712",     # Comparison to True/False in SQLAlchemy filters
    "A003",     # Class attribute shadowing builtin
    "A002",     # Function argument shadowing builtin (e.g., 'type' in FastAPI query params)
    "N818",     # AppException naming is intentional
    "B008",     # FastAPI Query/Depends in function defaults is the correct pattern
    "B905",     # zip() strict parameter requirement
    "TC001",    # Type-checking imports - SQLAlchemy models need runtime imports for relationships
    "TC002",
    "TC003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.black]
target-version = ["py312"]
line-length = 100
extend-exclude = '''
/(
    alembic
  | \.venv.*
)/
'''

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = ["alembic", "\\.venv"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/core/config.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
